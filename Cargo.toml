[workspace]
members = [
  "rust/ghostdeck-protocol",
  "rust/ghostdeck-core",
  "rust/ghostdeck-control",
  "rust/ghostdeck-cli",
  "rust/ghostdeck-ghostty-sys",
  "rust/ghostdeck-host-linux",
]
resolver = "2"

[workspace.package]
authors = ["ghostdeck contributors"]
edition = "2021"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1.46", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
