[package]
name = "ghostdeck-host-linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ghostdeck"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
gdk4-wayland = "0.11"
libadwaita = "0.9"
uuid = { version = "1", features = ["v4"] }
ghostdeck-control = { path = "../ghostdeck-control" }
ghostdeck-protocol = { path = "../ghostdeck-protocol" }
ghostdeck-ghostty-sys = { path = "../ghostdeck-ghostty-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
shell-quote = { version = "0.7.2", default-features = false, features = ["bash"] }

[dev-dependencies]
tempfile.workspace = true
